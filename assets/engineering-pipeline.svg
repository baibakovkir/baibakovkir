<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 350" role="img" aria-labelledby="title desc"><title id="title">Kirill Baibakov — from domain to delivery</title><desc id="desc">Five connected steps: model, persist, serve, interact, deliver. The mobile layout stacks readable cards vertically.</desc><style>
.bg{fill:#0d1424}.panel{fill:#141f34;stroke:#30415b;stroke-width:1}.tile{fill:#1b2b45;stroke:#456080;stroke-width:1}
.title{fill:#f0f6ff;font:700 32px system-ui,sans-serif}.label{fill:#edf4ff;font:600 17px system-ui,sans-serif}
.copy{fill:#b9c9df;font:15px system-ui,sans-serif}.small{fill:#aebfd6;font:13px system-ui,sans-serif}
.kicker{fill:#69dccb;font:600 12px ui-monospace,monospace;letter-spacing:1.4px}.accent{fill:#69dccb}
.wire{fill:none;stroke:#4b6b91;stroke-width:2}.flow{fill:none;stroke:#69dccb;stroke-width:2;stroke-dasharray:5 9;animation:flow 2s linear infinite}
.step{animation:step 8s ease-in-out infinite;animation-delay:var(--delay,0s)}.signal{fill:#69dccb;animation:signal 4s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes flow{to{stroke-dashoffset:-28}}@keyframes step{0%,100%{stroke:#456080}20%,40%{stroke:#69dccb}}
@keyframes signal{0%,100%{opacity:.25}35%,60%{opacity:1}}
@media(prefers-color-scheme:light){.bg{fill:#f4f7fc}.panel{fill:#fff;stroke:#ccd8e8}.tile{fill:#edf3fc;stroke:#a8bad2}.title,.label{fill:#14263f}.copy{fill:#405874}.small{fill:#4c6380}.kicker,.accent{fill:#087f76}.flow{stroke:#087f76}.signal{fill:#087f76}}
@media(prefers-reduced-motion:reduce){.flow,.step,.signal{animation:none}.signal{opacity:1}}
</style><rect width="960" height="350" rx="20" class="bg"/><text x="36" y="38" class="kicker" >KIRILL BAIBAKOV</text><text x="36" y="87" class="title" >From domain to delivery.</text><text x="36" y="120" class="copy" >Full-stack engineer · reliable products, clear boundaries, shared state.</text><path d="M204 236h12" class="wire"/><path d="M204 236h12" class="flow"/><rect x="36" y="174" width="168" height="125" rx="14" class="tile step" style="--delay:0.0s"/><text x="52" y="201" class="kicker" >01</text><text x="52" y="239" class="label" >Model</text><text x="52" y="267" class="small" >Rules + ownership</text><circle cx="186" cy="196" r="4" class="signal" style="--delay:0.0s"/><path d="M384 236h12" class="wire"/><path d="M384 236h12" class="flow"/><rect x="216" y="174" width="168" height="125" rx="14" class="tile step" style="--delay:1.3s"/><text x="232" y="201" class="kicker" >02</text><text x="232" y="239" class="label" >Persist</text><text x="232" y="267" class="small" >PostgreSQL</text><circle cx="366" cy="196" r="4" class="signal" style="--delay:0.7s"/><path d="M564 236h12" class="wire"/><path d="M564 236h12" class="flow"/><rect x="396" y="174" width="168" height="125" rx="14" class="tile step" style="--delay:2.6s"/><text x="412" y="201" class="kicker" >03</text><text x="412" y="239" class="label" >Serve</text><text x="412" y="267" class="small" >Go / Node.js</text><circle cx="546" cy="196" r="4" class="signal" style="--delay:1.4s"/><path d="M744 236h12" class="wire"/><path d="M744 236h12" class="flow"/><rect x="576" y="174" width="168" height="125" rx="14" class="tile step" style="--delay:3.9000000000000004s"/><text x="592" y="201" class="kicker" >04</text><text x="592" y="239" class="label" >Interact</text><text x="592" y="267" class="small" >React / Next.js</text><circle cx="726" cy="196" r="4" class="signal" style="--delay:2.0999999999999996s"/><rect x="756" y="174" width="168" height="125" rx="14" class="tile step" style="--delay:5.2s"/><text x="772" y="201" class="kicker" >05</text><text x="772" y="239" class="label" >Deliver</text><text x="772" y="267" class="small" >Tests / Docker / CI</text><circle cx="906" cy="196" r="4" class="signal" style="--delay:2.8s"/></svg>
