<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Kirill Baibakov — full-stack engineering pipeline</title>
  <desc id="description">An animated pipeline connecting product requirements, PostgreSQL, NestJS and Go APIs, a Next.js interface, and continuous delivery.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f8fa"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0969da"/>
      <stop offset="0.52" stop-color="#8250df"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1f2328" flood-opacity="0.10"/>
    </filter>
    <style>
      .surface { fill: url(#background); }
      .grid { stroke: #d8dee4; opacity: .5; }
      .eyebrow { fill: #0969da; font: 600 16px ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: 1.8px; }
      .heading { fill: #1f2328; font: 700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .subheading { fill: #57606a; font: 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .card-title { fill: #1f2328; font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card-detail { fill: #57606a; font: 13px ui-monospace, SFMono-Regular, Consolas, monospace; }
      .icon { fill: none; stroke: #0969da; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .icon.copy { filter: drop-shadow(0 0 4px #58a6ff); }
      .track { fill: none; stroke: #afb8c1; stroke-width: 3; stroke-linecap: round; }
      .flow { fill: none; stroke: url(#accent); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 8 13; animation: flow 1.1s linear infinite; }
      .pulse { fill: #8250df; filter: drop-shadow(0 0 7px #8250df); animation: travel 16s linear infinite; }
      .copy { opacity: .08; animation-duration: 16s; animation-timing-function: linear; animation-iteration-count: infinite; }
      .copy-1 { animation-name: reveal-1; }
      .copy-2 { animation-name: reveal-2; }
      .copy-3 { animation-name: reveal-3; }
      .copy-4 { animation-name: reveal-4; }
      .copy-5 { animation-name: reveal-5; }
      .status { fill: #1a7f37; animation: status 16s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -21; } }
      @keyframes travel {
        0% { transform: translateX(-60px); opacity: 0; }
        3% { transform: translateX(-40px); opacity: 1; }
        8% { transform: translateX(0); opacity: 1; }
        13% { transform: translateX(25px); opacity: 1; }
        23% { transform: translateX(206px); opacity: 1; }
        25% { transform: translateX(231px); opacity: 1; }
        30% { transform: translateX(256px); opacity: 1; }
        40% { transform: translateX(437px); opacity: 1; }
        42% { transform: translateX(462px); opacity: 1; }
        47% { transform: translateX(487px); opacity: 1; }
        57% { transform: translateX(668px); opacity: 1; }
        59% { transform: translateX(693px); opacity: 1; }
        64% { transform: translateX(718px); opacity: 1; }
        74% { transform: translateX(899px); opacity: 1; }
        76% { transform: translateX(924px); opacity: 1; }
        86% { transform: translateX(972px); opacity: 1; }
        92%, 100% { transform: translateX(1010px); opacity: 0; }
      }
      @keyframes reveal-1 { 0%, 6%, 94%, 100% { opacity: .08; } 8%, 92% { opacity: 1; } }
      @keyframes reveal-2 { 0%, 23%, 94%, 100% { opacity: .08; } 25%, 92% { opacity: 1; } }
      @keyframes reveal-3 { 0%, 40%, 94%, 100% { opacity: .08; } 42%, 92% { opacity: 1; } }
      @keyframes reveal-4 { 0%, 57%, 94%, 100% { opacity: .08; } 59%, 92% { opacity: 1; } }
      @keyframes reveal-5 { 0%, 74%, 94%, 100% { opacity: .08; } 76%, 92% { opacity: 1; } }
      @keyframes status {
        0%, 74% { opacity: .2; }
        76%, 92% { opacity: 1; }
        94%, 100% { opacity: .2; }
      }
      @media (prefers-color-scheme: dark) {
        .surface { fill: #0d1117; }
        .grid { stroke: #30363d; }
        .heading, .card-title { fill: #f0f6fc; }
        .subheading, .card-detail { fill: #8b949e; }
        .eyebrow { fill: #58a6ff; }
        .card { fill: #161b22; stroke: #30363d; }
        .icon { stroke: #58a6ff; }
        .track { stroke: #484f58; }
      }
      @media (prefers-reduced-motion: reduce) {
        .flow, .pulse, .copy, .status { animation: none; }
        .pulse { opacity: 0; }
        .copy, .status { opacity: 1; }
      }
    </style>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path class="grid" d="M28 0H0V28" fill="none"/>
    </pattern>
  </defs>

  <rect class="surface" width="1200" height="420" rx="24"/>
  <rect width="1200" height="420" rx="24" fill="url(#grid)" opacity=".55"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#8c959f" opacity=".25"/>

  <text class="eyebrow" x="64" y="66">KIRILL BAIBAKOV · FULL-STACK ENGINEER</text>
  <text class="heading" x="64" y="116">Building reliable web products end to end.</text>
  <text class="subheading" x="64" y="151">From domain requirements to production delivery.</text>

  <path class="track" d="M139 194H1060"/>
  <path class="flow" d="M139 194H1060"/>
  <g class="node" transform="translate(48 218)" filter="url(#shadow)">
    <rect class="card" width="182" height="138" rx="15"/>
    <path class="icon copy copy-1" d="M24 31h22M24 42h16M24 53h19M56 29l8 8-8 8"/>
    <g class="copy copy-1">
      <text class="card-title" x="22" y="88">Requirements</text>
      <text class="card-detail" x="22" y="111">domain model</text>
    </g>
  </g>

  <g class="node" transform="translate(279 218)" filter="url(#shadow)">
    <rect class="card" width="182" height="138" rx="15"/>
    <ellipse class="icon copy copy-2" cx="43" cy="31" rx="20" ry="7"/>
    <path class="icon copy copy-2" d="M23 31v23c0 4 9 7 20 7s20-3 20-7V31M23 42c0 4 9 7 20 7s20-3 20-7"/>
    <g class="copy copy-2">
      <text class="card-title" x="22" y="88">Data</text>
      <text class="card-detail" x="22" y="111">PostgreSQL</text>
    </g>
  </g>

  <g class="node" transform="translate(510 218)" filter="url(#shadow)">
    <rect class="card" width="182" height="138" rx="15"/>
    <path class="icon copy copy-3" d="M23 33l11-8 11 8v16l-11 8-11-8zM45 33l11-8 11 8v16l-11 8-11-8"/>
    <g class="copy copy-3">
      <text class="card-title" x="22" y="88">API</text>
      <text class="card-detail" x="22" y="111">NestJS · Go</text>
    </g>
  </g>

  <g class="node" transform="translate(741 218)" filter="url(#shadow)">
    <rect class="card" width="182" height="138" rx="15"/>
    <rect class="icon copy copy-4" x="23" y="27" width="40" height="29" rx="4"/>
    <path class="icon copy copy-4" d="M23 36h40M34 63h18"/>
    <g class="copy copy-4">
      <text class="card-title" x="22" y="88">Interface</text>
      <text class="card-detail" x="22" y="111">React · Next.js</text>
    </g>
  </g>

  <g class="node" transform="translate(972 218)" filter="url(#shadow)">
    <rect class="card" width="182" height="138" rx="15"/>
    <path class="icon copy copy-5" d="M23 43l10 10 26-27M51 53h13"/>
    <circle class="status" cx="153" cy="27" r="7"/>
    <g class="copy copy-5">
      <text class="card-title" x="22" y="88">Delivery</text>
      <text class="card-detail" x="22" y="111">Docker · CI/CD</text>
    </g>
  </g>

  <!-- Rendered last so the moving signal always stays above the cards. -->
  <circle class="pulse" cx="139" cy="194" r="8"/>
</svg>
