<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 1550" role="img" aria-labelledby="title desc"><title id="title">Engineering decisions — shared models, server rules, snapshots and recovery</title><desc id="desc">Four animated diagrams show shared 2D/3D data, authoritative realtime state, immutable assignment snapshots, and checked releases with recovery. All labels stay visible, including with reduced motion.</desc><style>
.bg{fill:#0d1424}.panel{fill:#141f34;stroke:#30415b;stroke-width:1}.tile{fill:#1b2b45;stroke:#456080;stroke-width:1}
.title{fill:#f0f6ff;font:700 32px system-ui,sans-serif}.label{fill:#edf4ff;font:600 17px system-ui,sans-serif}
.copy{fill:#b9c9df;font:15px system-ui,sans-serif}.small{fill:#aebfd6;font:13px system-ui,sans-serif}
.kicker{fill:#69dccb;font:600 12px ui-monospace,monospace;letter-spacing:1.4px}.accent{fill:#69dccb}
.wire{fill:none;stroke:#4b6b91;stroke-width:2}.flow{fill:none;stroke:#69dccb;stroke-width:2;stroke-dasharray:5 9;animation:flow 2s linear infinite}
.step{animation:step 8s ease-in-out infinite;animation-delay:var(--delay,0s)}.signal{fill:#69dccb;animation:signal 4s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes flow{to{stroke-dashoffset:-28}}@keyframes step{0%,100%{stroke:#456080}20%,40%{stroke:#69dccb}}
@keyframes signal{0%,100%{opacity:.25}35%,60%{opacity:1}}
@media(prefers-color-scheme:light){.bg{fill:#f4f7fc}.panel{fill:#fff;stroke:#ccd8e8}.tile{fill:#edf3fc;stroke:#a8bad2}.title,.label{fill:#14263f}.copy{fill:#405874}.small{fill:#4c6380}.kicker,.accent{fill:#087f76}.flow{stroke:#087f76}.signal{fill:#087f76}}
@media(prefers-reduced-motion:reduce){.flow,.step,.signal{animation:none}.signal{opacity:1}}
</style><rect width="360" height="1550" rx="20" class="bg"/><text x="24" y="38" class="kicker" >ENGINEERING IN PRACTICE</text><text x="24" y="77" class="label" >Decisions that hold up.</text><rect x="16" y="100" width="328" height="340" rx="14" class="panel" /><text x="34" y="127" class="kicker" >01 / SHARED MODEL</text><text x="34" y="311" class="label" >One model. Two views.</text><text x="34" y="339" class="copy" >Metric domain data drives both</text><text x="34" y="361" class="copy" >the 2D plan and the 3D scene.</text><text x="34" y="383" class="copy" >Geometry stays consistent.</text><rect x="34" y="189" width="120" height="64" rx="14" class="tile" /><text x="94.0" y="215" class="label" text-anchor="middle">Domain</text><text x="94.0" y="238" class="small" text-anchor="middle">x / y / z</text><path d="M154 221h22v-45h14M176 221v40h14" class="wire"/><path d="M154 221h22v-45h14M176 221v40h14" class="flow"/><rect x="190" y="150" width="132" height="48" rx="14" class="tile" /><text x="256.0" y="176" class="label" text-anchor="middle">2D plan</text><rect x="190" y="236" width="132" height="48" rx="14" class="tile" /><text x="256.0" y="262" class="label" text-anchor="middle">3D scene</text><circle cx="176" cy="221" r="5" class="signal"/><rect x="16" y="458" width="328" height="340" rx="14" class="panel" /><text x="34" y="485" class="kicker" >02 / REALTIME RULES</text><text x="34" y="669" class="label" >The server decides.</text><text x="34" y="697" class="copy" >Validate input and commit once.</text><text x="34" y="719" class="copy" >Clients receive shared state;</text><text x="34" y="741" class="copy" >retries do not duplicate results.</text><rect x="34" y="508" width="125" height="48" rx="14" class="tile" /><text x="96.5" y="534" class="label" text-anchor="middle">Input #42</text><rect x="196" y="508" width="126" height="48" rx="14" class="tile" /><text x="259.0" y="534" class="label" text-anchor="middle">Validate</text><path d="M159 532h37" class="wire"/><path d="M159 532h37" class="flow"/><path d="M259 556v25h-80" class="wire"/><path d="M259 556v25h-80" class="flow"/><rect x="96" y="585" width="226" height="64" rx="14" class="tile" /><text x="209.0" y="611" class="label" text-anchor="middle">Commit once</text><text x="209.0" y="634" class="small" text-anchor="middle">shared state → clients</text><rect x="16" y="816" width="328" height="340" rx="14" class="panel" /><text x="34" y="843" class="kicker" >03 / VERSIONED CONTENT</text><text x="34" y="1027" class="label" >Edit without disruption.</text><text x="34" y="1055" class="copy" >The library can move to v2.</text><text x="34" y="1077" class="copy" >An assigned lesson or homework</text><text x="34" y="1099" class="copy" >keeps its original v1 snapshot.</text><rect x="34" y="866" width="125" height="48" rx="14" class="tile" /><text x="96.5" y="892" class="label" text-anchor="middle">Library v2</text><rect x="198" y="866" width="124" height="48" rx="14" class="tile" /><text x="260.0" y="892" class="label" text-anchor="middle">New work</text><path d="M159 890h39" class="wire"/><path d="M159 890h39" class="flow"/><rect x="34" y="950" width="125" height="48" rx="14" class="tile" /><text x="96.5" y="976" class="label" text-anchor="middle">Lesson v1</text><rect x="198" y="950" width="124" height="48" rx="14" class="tile" /><text x="260.0" y="976" class="label" text-anchor="middle">HW v1</text><text x="178" y="939" class="kicker" text-anchor="middle">SNAPSHOTS</text><rect x="16" y="1174" width="328" height="340" rx="14" class="panel" /><text x="34" y="1201" class="kicker" >04 / RELEASE RECOVERY</text><text x="34" y="1385" class="label" >Ship with a way back.</text><text x="34" y="1413" class="copy" >Checks, backup, release, health.</text><text x="34" y="1435" class="copy" >If the app fails its health check,</text><text x="34" y="1457" class="copy" >restore the previous release.</text><rect x="34" y="1224" width="90" height="48" rx="14" class="tile" /><text x="79.0" y="1250" class="label" text-anchor="middle">Checks</text><path d="M124 1248h9" class="wire"/><path d="M124 1248h9" class="flow"/><rect x="133" y="1224" width="90" height="48" rx="14" class="tile" /><text x="178.0" y="1250" class="label" text-anchor="middle">Backup</text><path d="M223 1248h9" class="wire"/><path d="M223 1248h9" class="flow"/><rect x="232" y="1224" width="90" height="48" rx="14" class="tile" /><text x="277.0" y="1250" class="label" text-anchor="middle">Release</text><path d="M277 1272v31" class="wire"/><path d="M277 1272v31" class="flow"/><rect x="208" y="1309" width="114" height="48" rx="14" class="tile" /><text x="265.0" y="1335" class="label" text-anchor="middle">Health</text><path d="M208 1333H152" class="wire"/><path d="M208 1333H152" class="flow"/><rect x="34" y="1309" width="118" height="48" rx="14" class="tile" /><text x="93.0" y="1335" class="label" text-anchor="middle">Rollback</text></svg>
