<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1024" role="img" aria-labelledby="title desc"><title id="title">Engineering decisions — shared models, server rules, snapshots and recovery</title><desc id="desc">Four animated diagrams show shared 2D/3D data, authoritative realtime state, immutable assignment snapshots, and checked releases with recovery. All labels stay visible, including with reduced motion.</desc><style>
.bg{fill:#0d1424}.panel{fill:#141f34;stroke:#30415b;stroke-width:1}.tile{fill:#1b2b45;stroke:#456080;stroke-width:1}
.title{fill:#f0f6ff;font:700 32px system-ui,sans-serif}.label{fill:#edf4ff;font:600 17px system-ui,sans-serif}
.copy{fill:#b9c9df;font:15px system-ui,sans-serif}.small{fill:#aebfd6;font:13px system-ui,sans-serif}
.kicker{fill:#69dccb;font:600 12px ui-monospace,monospace;letter-spacing:1.4px}.accent{fill:#69dccb}
.wire{fill:none;stroke:#4b6b91;stroke-width:2}.flow{fill:none;stroke:#69dccb;stroke-width:2;stroke-dasharray:5 9;animation:flow 2s linear infinite}
.step{animation:step 8s ease-in-out infinite;animation-delay:var(--delay,0s)}.signal{fill:#69dccb;animation:signal 4s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes flow{to{stroke-dashoffset:-28}}@keyframes step{0%,100%{stroke:#456080}20%,40%{stroke:#69dccb}}
@keyframes signal{0%,100%{opacity:.25}35%,60%{opacity:1}}
@media(prefers-color-scheme:light){.bg{fill:#f4f7fc}.panel{fill:#fff;stroke:#ccd8e8}.tile{fill:#edf3fc;stroke:#a8bad2}.title,.label{fill:#14263f}.copy{fill:#405874}.small{fill:#4c6380}.kicker,.accent{fill:#087f76}.flow{stroke:#087f76}.signal{fill:#087f76}}
@media(prefers-reduced-motion:reduce){.flow,.step,.signal{animation:none}.signal{opacity:1}}
</style><rect width="960" height="1024" rx="20" class="bg"/><text x="36" y="38" class="kicker" >ENGINEERING IN PRACTICE</text><text x="36" y="77" class="title" >Decisions that hold up.</text><rect x="24" y="112" width="912" height="210" rx="14" class="panel" /><text x="42" y="139" class="kicker" >01 / SHARED MODEL</text><text x="498" y="177" class="label" >One model. Two views.</text><text x="498" y="205" class="copy" >Metric domain data drives both</text><text x="498" y="227" class="copy" >the 2D plan and the 3D scene.</text><text x="498" y="249" class="copy" >Geometry stays consistent.</text><rect x="42" y="201" width="120" height="64" rx="14" class="tile" /><text x="102.0" y="227" class="label" text-anchor="middle">Domain</text><text x="102.0" y="250" class="small" text-anchor="middle">x / y / z</text><path d="M162 233h22v-45h14M184 233v40h14" class="wire"/><path d="M162 233h22v-45h14M184 233v40h14" class="flow"/><rect x="198" y="162" width="132" height="48" rx="14" class="tile" /><text x="264.0" y="188" class="label" text-anchor="middle">2D plan</text><rect x="198" y="248" width="132" height="48" rx="14" class="tile" /><text x="264.0" y="274" class="label" text-anchor="middle">3D scene</text><circle cx="184" cy="233" r="5" class="signal"/><rect x="24" y="338" width="912" height="210" rx="14" class="panel" /><text x="42" y="365" class="kicker" >02 / REALTIME RULES</text><text x="498" y="403" class="label" >The server decides.</text><text x="498" y="431" class="copy" >Validate input and commit once.</text><text x="498" y="453" class="copy" >Clients receive shared state;</text><text x="498" y="475" class="copy" >retries do not duplicate results.</text><rect x="42" y="388" width="125" height="48" rx="14" class="tile" /><text x="104.5" y="414" class="label" text-anchor="middle">Input #42</text><rect x="204" y="388" width="126" height="48" rx="14" class="tile" /><text x="267.0" y="414" class="label" text-anchor="middle">Validate</text><path d="M167 412h37" class="wire"/><path d="M167 412h37" class="flow"/><path d="M267 436v25h-80" class="wire"/><path d="M267 436v25h-80" class="flow"/><rect x="104" y="465" width="226" height="64" rx="14" class="tile" /><text x="217.0" y="491" class="label" text-anchor="middle">Commit once</text><text x="217.0" y="514" class="small" text-anchor="middle">shared state → clients</text><rect x="24" y="564" width="912" height="210" rx="14" class="panel" /><text x="42" y="591" class="kicker" >03 / VERSIONED CONTENT</text><text x="498" y="629" class="label" >Edit without disruption.</text><text x="498" y="657" class="copy" >The library can move to v2.</text><text x="498" y="679" class="copy" >An assigned lesson or homework</text><text x="498" y="701" class="copy" >keeps its original v1 snapshot.</text><rect x="42" y="614" width="125" height="48" rx="14" class="tile" /><text x="104.5" y="640" class="label" text-anchor="middle">Library v2</text><rect x="206" y="614" width="124" height="48" rx="14" class="tile" /><text x="268.0" y="640" class="label" text-anchor="middle">New work</text><path d="M167 638h39" class="wire"/><path d="M167 638h39" class="flow"/><rect x="42" y="698" width="125" height="48" rx="14" class="tile" /><text x="104.5" y="724" class="label" text-anchor="middle">Lesson v1</text><rect x="206" y="698" width="124" height="48" rx="14" class="tile" /><text x="268.0" y="724" class="label" text-anchor="middle">HW v1</text><text x="186" y="687" class="kicker" text-anchor="middle">SNAPSHOTS</text><rect x="24" y="790" width="912" height="210" rx="14" class="panel" /><text x="42" y="817" class="kicker" >04 / RELEASE RECOVERY</text><text x="498" y="855" class="label" >Ship with a way back.</text><text x="498" y="883" class="copy" >Checks, backup, release, health.</text><text x="498" y="905" class="copy" >If the app fails its health check,</text><text x="498" y="927" class="copy" >restore the previous release.</text><rect x="42" y="840" width="90" height="48" rx="14" class="tile" /><text x="87.0" y="866" class="label" text-anchor="middle">Checks</text><path d="M132 864h9" class="wire"/><path d="M132 864h9" class="flow"/><rect x="141" y="840" width="90" height="48" rx="14" class="tile" /><text x="186.0" y="866" class="label" text-anchor="middle">Backup</text><path d="M231 864h9" class="wire"/><path d="M231 864h9" class="flow"/><rect x="240" y="840" width="90" height="48" rx="14" class="tile" /><text x="285.0" y="866" class="label" text-anchor="middle">Release</text><path d="M285 888v31" class="wire"/><path d="M285 888v31" class="flow"/><rect x="216" y="925" width="114" height="48" rx="14" class="tile" /><text x="273.0" y="951" class="label" text-anchor="middle">Health</text><path d="M216 949H160" class="wire"/><path d="M216 949H160" class="flow"/><rect x="42" y="925" width="118" height="48" rx="14" class="tile" /><text x="101.0" y="951" class="label" text-anchor="middle">Rollback</text></svg>
