<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 680" role="img" aria-labelledby="title desc"><title id="title">Kirill Baibakov — from domain to delivery</title><desc id="desc">Five connected steps: model, persist, serve, interact, deliver. The mobile layout stacks readable cards vertically.</desc><style>
.bg{fill:#0d1424}.panel{fill:#141f34;stroke:#30415b;stroke-width:1}.tile{fill:#1b2b45;stroke:#456080;stroke-width:1}
.title{fill:#f0f6ff;font:700 32px system-ui,sans-serif}.label{fill:#edf4ff;font:600 17px system-ui,sans-serif}
.copy{fill:#b9c9df;font:15px system-ui,sans-serif}.small{fill:#aebfd6;font:13px system-ui,sans-serif}
.kicker{fill:#69dccb;font:600 12px ui-monospace,monospace;letter-spacing:1.4px}.accent{fill:#69dccb}
.wire{fill:none;stroke:#4b6b91;stroke-width:2}.flow{fill:none;stroke:#69dccb;stroke-width:2;stroke-dasharray:5 9;animation:flow 2s linear infinite}
.step{animation:step 8s ease-in-out infinite;animation-delay:var(--delay,0s)}.signal{fill:#69dccb;animation:signal 4s ease-in-out infinite;animation-delay:var(--delay,0s)}
@keyframes flow{to{stroke-dashoffset:-28}}@keyframes step{0%,100%{stroke:#456080}20%,40%{stroke:#69dccb}}
@keyframes signal{0%,100%{opacity:.25}35%,60%{opacity:1}}
@media(prefers-color-scheme:light){.bg{fill:#f4f7fc}.panel{fill:#fff;stroke:#ccd8e8}.tile{fill:#edf3fc;stroke:#a8bad2}.title,.label{fill:#14263f}.copy{fill:#405874}.small{fill:#4c6380}.kicker,.accent{fill:#087f76}.flow{stroke:#087f76}.signal{fill:#087f76}}
@media(prefers-reduced-motion:reduce){.flow,.step,.signal{animation:none}.signal{opacity:1}}
</style><rect width="360" height="680" rx="20" class="bg"/><text x="24" y="38" class="kicker" >KIRILL BAIBAKOV</text><text x="24" y="78" class="title" >From domain</text><text x="24" y="117" class="title" >to delivery.</text><text x="24" y="150" class="copy" >Full-stack engineer · Go / TypeScript</text><path d="M180 255v19" class="wire"/><path d="M180 255v19" class="flow"/><rect x="24" y="183" width="312" height="72" rx="14" class="tile step" style="--delay:0.0s"/><text x="40" y="210" class="kicker" >01</text><text x="78" y="211" class="label" >Model</text><text x="78" y="235" class="small" >Rules + ownership</text><circle cx="318" cy="205" r="4" class="signal" style="--delay:0.0s"/><path d="M180 346v19" class="wire"/><path d="M180 346v19" class="flow"/><rect x="24" y="274" width="312" height="72" rx="14" class="tile step" style="--delay:1.3s"/><text x="40" y="301" class="kicker" >02</text><text x="78" y="302" class="label" >Persist</text><text x="78" y="326" class="small" >PostgreSQL</text><circle cx="318" cy="296" r="4" class="signal" style="--delay:0.7s"/><path d="M180 437v19" class="wire"/><path d="M180 437v19" class="flow"/><rect x="24" y="365" width="312" height="72" rx="14" class="tile step" style="--delay:2.6s"/><text x="40" y="392" class="kicker" >03</text><text x="78" y="393" class="label" >Serve</text><text x="78" y="417" class="small" >Go / Node.js</text><circle cx="318" cy="387" r="4" class="signal" style="--delay:1.4s"/><path d="M180 528v19" class="wire"/><path d="M180 528v19" class="flow"/><rect x="24" y="456" width="312" height="72" rx="14" class="tile step" style="--delay:3.9000000000000004s"/><text x="40" y="483" class="kicker" >04</text><text x="78" y="484" class="label" >Interact</text><text x="78" y="508" class="small" >React / Next.js</text><circle cx="318" cy="478" r="4" class="signal" style="--delay:2.0999999999999996s"/><rect x="24" y="547" width="312" height="72" rx="14" class="tile step" style="--delay:5.2s"/><text x="40" y="574" class="kicker" >05</text><text x="78" y="575" class="label" >Deliver</text><text x="78" y="599" class="small" >Tests / Docker / CI</text><circle cx="318" cy="569" r="4" class="signal" style="--delay:2.8s"/></svg>
